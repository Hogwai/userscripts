name: Build Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npm run validate:manifest

      - name: Build all scripts
        run: npm run build:all

      - name: Verify generated metadata versions
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          import { listScripts, readManifest, validateManifest } from './scripts/manifest.js';

          const manifest = readManifest();
          const errors = validateManifest(manifest, { requireEntries: true });
          if (errors.length > 0) {
            throw new Error(errors.join('\n'));
          }

          const scripts = listScripts(manifest);
          for (const item of scripts) {
            const output = await readFile(item.output, 'utf8');
            const expected = `// @version     ${item.version}`;
            if (!output.includes(expected)) {
              throw new Error(`${item.id}: missing generated version metadata (${expected})`);
            }
          }

          console.log(`Validated ${scripts.length} script metadata file(s).`);
          EOF
